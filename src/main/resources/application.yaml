server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:astronautdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

# URL do Microsserviço Python para análise de telemetria
analytics:
  service:
    url: http://localhost:5000/api/v1/analyze